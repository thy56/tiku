<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一练 · 山东专升本计算机</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/design.css">
<style>
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 15px;
  text-decoration:none;display:block;transition:border-color .15s,box-shadow .15s}
.dcard:hover{border-color:var(--blue-400);box-shadow:0 3px 12px rgba(46,116,181,.09)}
.dcard .n{font-size:15.5px;font-weight:700;color:var(--blue-900);line-height:1.3}
.dcard .dt{font-size:12px;color:var(--ink-4);margin-top:4px}
.dcard .mt{font-size:11.5px;color:var(--ink-4);margin-top:8px;
  display:flex;justify-content:space-between;align-items:center}
.dcard .mt b{color:var(--blue-600);font-weight:600}
.dcard.today{border:1.5px solid var(--blue-500);background:var(--blue-50)}
.tbadge{font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--blue-600);
  color:#fff;font-weight:600;margin-left:5px;vertical-align:middle}
.dsec{margin:26px 0 13px;font-size:15px;font-weight:700;color:var(--blue-900);
  display:flex;align-items:baseline;gap:9px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.dsec .n{font-size:12px;font-weight:400;color:var(--ink-4);margin-left:auto}
.anline{margin-top:8px;font-size:13px;line-height:1.9;color:var(--ink-2)}
.dl-dist{background:var(--bg-2);border:1px solid var(--line);border-radius:13px;
  padding:15px 17px;margin-bottom:22px}
.dl-dist-t{font-size:13.5px;font-weight:700;color:var(--blue-900);margin-bottom:11px}
.dl-chips{display:flex;flex-wrap:wrap;gap:8px}
.dl-chip{background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:7px 13px;font-size:12.5px;color:var(--ink-3);
  display:flex;align-items:center;gap:8px}
.dl-chip b{color:var(--blue-800);font-size:13.5px}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pbar a{background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:7px 15px;font-size:13px;color:var(--ink-2);text-decoration:none}
.pbar a:hover{border-color:var(--blue-400);color:var(--blue-700)}
.pbar a.dis{opacity:.4;pointer-events:none}
.pbar button{background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:7px 15px;font-size:13px;color:var(--ink-2);cursor:pointer;font-family:inherit}
.pbar button:hover{border-color:var(--blue-400);color:var(--blue-700)}
.pbar .sp{margin-left:auto}
.nodata{background:var(--bg-2);border:1px dashed var(--line);border-radius:14px;
  padding:16px 20px;font-size:13px;color:var(--ink-4)}
</style>
</head>
<body>

<div id="nav" class="nav"></div>

<div class="page-head">
  <div class="in">
    <h1 id="h1">每日一练</h1>
    <div class="sub" id="sub"></div>
  </div>
</div>

<div class="main narrow">

  <div class="pbar">
    <a id="pBack" href="每日一练.html">← 全部</a>
    <a id="pPrev" href="#">← 上一天</a>
    <a id="pNext" href="#">下一天 →</a>
    <span class="sp"></span>
    <button id="dlAll">全部看答案</button>
    <button id="dlNone">全部收起</button>
  </div>

  <div id="main"></div>
</div>

<div class="footer">山东专升本计算机</div>
<button class="top" id="top" title="回到顶部">↑</button>

<script>window.GS_STATIC_MAP={ "__home": "每日一练.html" };</script>
<script src="assets/manifest.js"></script>
<script src="assets/nav.js"></script>
<script>window.GS_PAGE = { subject: "计算机", globalName: "JS_QUESTIONS", flat: "jisuanji" };</script>
<script src="data/questions.js"></script>
<script src="data/daily100.js"></script>
<script src="../assets/bankflat.js"></script>
<script src="../assets/pg_daily_sub.js"></script>
<script src="../assets/mathrender.js"></script>
<script>(function(){"use strict";var e=document.getElementById("top");
if(e)e.onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};})();</script>
</body>
</html>
