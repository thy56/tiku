<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词根专项 · 山东专升本英语</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/design.css">
<style>
#tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.mbtn{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;
  text-align:left;cursor:pointer;font-family:inherit;transition:border-color .15s,box-shadow .15s}
.mbtn:hover{border-color:var(--blue-400);box-shadow:0 3px 12px rgba(46,116,181,.08)}
.mbtn.on{border:1.5px solid var(--blue-500);background:var(--blue-50)}
.mbtn b{display:block;font-size:15px;color:var(--blue-900);margin-bottom:4px}
.mbtn span{font-size:12px;color:var(--ink-4)}

#guide{background:var(--bg-2);border:1px solid var(--line);border-radius:13px;
  padding:14px 18px;font-size:13px;line-height:1.85;color:var(--ink-3);margin-bottom:16px}
#guide b{color:var(--blue-800)}

.sline{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-3);
  flex-wrap:wrap;margin-bottom:18px}
.sline b{color:var(--blue-700);font-size:14px}
.sp-bar{flex:1;min-width:140px;height:7px;background:var(--line);border-radius:20px;overflow:hidden}
.sp-bar i{display:block;height:100%;background:var(--blue-500);border-radius:20px;transition:width .25s}

.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;margin-bottom:13px}
.qcard.ok{border-color:#56b377;background:#f6fdf8}
.qcard.no{border-color:#e08b8b;background:#fffafa}
.qmeta{font-size:11.5px;color:var(--ink-4);margin-bottom:9px}
.qroot{font-size:26px;font-weight:700;color:var(--blue-900);letter-spacing:.5px;
  font-family:var(--font-mono,ui-monospace,monospace);margin-bottom:6px}
.qstem{font-size:14px;line-height:1.95;color:var(--ink)}
.qq{font-size:13px;color:var(--blue-800);font-weight:600}

.qopts{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.opt{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 16px;
  cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink-2);transition:all .13s}
.opt:hover:not(:disabled){border-color:var(--blue-400);background:var(--blue-50)}
.opt.right{border:1.5px solid #56b377;background:#eefaf1;color:#2f7d4f;font-weight:600}
.opt.wrong{border:1.5px solid #e08b8b;background:#fdf0f0;color:#b04a4a}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}

.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chip{background:var(--blue-50);border:1px solid var(--blue-200);border-radius:8px;
  padding:5px 11px;font-size:12.5px;color:var(--blue-800)}
.chip b{font-family:var(--font-mono,ui-monospace,monospace);margin-right:5px}

.qans{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:11px}
.qverdict{font-size:13px;font-weight:700;margin-bottom:7px}
.isok .qverdict{color:#2f7d4f}
.isno .qverdict{color:#b04a4a}
.qwhy{font-size:13px;line-height:1.85;color:var(--ink-2)}
.qwhy b{color:var(--blue-800);font-family:var(--font-mono,ui-monospace,monospace)}

.pbtns{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.ptog{background:var(--blue-600);color:#fff;border:none;border-radius:9px;
  padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.ptog:hover{background:var(--blue-700)}
.mark{background:#fff;border:1px solid var(--line);border-radius:9px;
  padding:8px 14px;font-size:12.5px;color:var(--ink-3);cursor:pointer;font-family:inherit}
.mark:hover{border-color:#56b377;color:#2f7d4f}
.mark.on{background:#eefaf1;border-color:#56b377;color:#2f7d4f;font-weight:600}
.mark.no.on{background:#fdf0f0;border-color:#e08b8b;color:#b04a4a}

.pans{margin-top:13px;border-top:1px dashed var(--line-2);padding-top:12px}

/* ===== 答案条 ===== */
.dans{background:#f2f9f4;border:1px solid #cfe8d8;border-radius:9px;
  padding:10px 14px;font-size:13.5px;line-height:1.9;color:#276a43;margin-bottom:14px}
.dans span{display:inline-block;font-size:11px;font-weight:700;color:#5aa87a;
  background:#fff;border:1px solid #cfe8d8;border-radius:5px;padding:1px 7px;
  margin-right:9px;vertical-align:1px}

/* ===== 词根详解卡 ===== */
.dwrap{margin-top:6px}
.dcard{border:1px solid var(--line);border-radius:12px;background:#fcfdff;
  margin-bottom:16px;overflow:hidden}
.dhd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  background:linear-gradient(180deg,#eef6fd,#f7fbff);
  border-bottom:1px solid var(--line);padding:12px 16px}
.droot{font-family:var(--font-mono,ui-monospace,monospace);font-size:19px;
  color:var(--blue-900);letter-spacing:.5px}
.dcore{font-size:14px;font-weight:700;color:#2f7d4f}

.dsec{padding:12px 16px;border-bottom:1px solid #f0f4f8}
.dsec:last-child{border-bottom:none}
.dsk{font-size:11.5px;font-weight:700;color:#7d94a8;letter-spacing:.4px;
  margin-bottom:7px;text-transform:none}
.dst{font-size:13px;line-height:1.95;color:var(--ink-2)}

/* 词族表 */
.dfam{width:100%;border-collapse:collapse;font-size:12.5px}
.dfam td{padding:6px 8px;vertical-align:top}
.dfam tr:nth-child(odd) td{border-top:1px solid #f2f6fa}
.fc-pre{white-space:nowrap;color:#8fa4b8;font-size:11.5px;width:1%;
  padding-left:0 !important}
.fc-w{font-family:var(--font-mono,ui-monospace,monospace);font-weight:600;
  color:var(--blue-800);white-space:nowrap;width:1%}
.fc-pos{color:#a8b8c6;font-size:11px;white-space:nowrap;width:1%}
.fc-cn{color:var(--ink-2)}
.fc-why{color:#8ca0b3;font-size:11.5px;line-height:1.7;
  padding-top:0 !important;padding-bottom:8px !important}

/* 搭配 */
.dcol{margin:0;padding-left:20px;font-size:12.5px;line-height:2;color:var(--ink-2)}
.dcol li{list-style:disc}
.dcol li::marker{color:var(--blue-300)}

/* 辨析 */
.dconf{background:#fff;border:1px solid #eef3f8;border-radius:9px;
  padding:9px 12px;margin-bottom:8px}
.dconf:last-child{margin-bottom:0}
.dconf-h{font-size:12.5px;margin-bottom:5px}
.dconf-h b{font-family:var(--font-mono,ui-monospace,monospace);
  color:#b06a2a;background:#fdf6ec;border:1px solid #f2e2c9;
  border-radius:5px;padding:1px 7px}
.dconf-h .vs{color:#b8c6d2;font-size:11px;margin:0 2px}
.dconf-t{font-size:12.5px;line-height:1.85;color:var(--ink-2)}

/* 记忆诀窍 / 考点 */
.dmnem{background:#fffdf5;border-left:3px solid #e8c56a}
.dexam{background:#f7fbfe;border-left:3px solid var(--blue-300)}
.dmnem .dsk{color:#b8952f}
.dexam .dsk{color:var(--blue-600)}

/* 词族词汇表 */
.dwords{border:1px solid var(--line);border-radius:12px;background:#fff;
  padding:12px 16px;margin-top:4px}
.dtab{width:100%;border-collapse:collapse;font-size:12.5px}
.dtab td{padding:5px 7px;vertical-align:top;border-bottom:1px solid #f4f7fa}
.dtab tr:last-child td{border-bottom:none}
.dw{font-family:var(--font-mono,ui-monospace,monospace);color:var(--blue-800);
  font-weight:600;white-space:nowrap;width:1%}
.dp{color:#a0b0c0;font-size:11px;white-space:nowrap;width:1%}
.dm{color:var(--ink-2)}
.dmem{color:#8ca0b3;font-size:11.5px;line-height:1.7;padding-top:0 !important;
  padding-bottom:7px !important}
.dmore{padding:7px 0 0;font-size:11.5px;color:#93a5b6;text-align:center}

/* 原题解析 */
.dexp{margin-top:12px;background:#f8fafc;border:1px dashed var(--line-2);
  border-radius:9px;padding:10px 13px;font-size:12.5px;line-height:1.85;color:var(--ink-3)}
.dexp span{display:inline-block;font-size:10.5px;color:#93a5b6;
  border:1px solid #e3ebf3;border-radius:4px;padding:1px 6px;margin-right:8px;
  vertical-align:1px;background:#fff}

@media (max-width:640px){
  .qroot{font-size:22px}
  .dsec{padding:10px 12px}
  .dhd{padding:10px 12px}
  .droot{font-size:17px}
  .dfam,.dtab{font-size:11.5px}
  .dfam td,.dtab td{padding:5px 5px}
  .fc-pre{font-size:10.5px}
}
</style>
</head>
