<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证明题专项 · 山东专升本高数一</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/type.css">
</head>
<body>

<div id="nav" class="nav"></div>

<div class="page-head">
  <div class="in">
    <h1>证明题专项 <span class="badge" id="hBadge">30 题</span></h1>
    <div class="sub">证明 共 <b id="hCntQ">-</b> 道题、<b id="hCntK">-</b> 个知识点，跨章节聚合。按知识点分块，一块一块攻。</div>
  </div>
</div>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="search">
      <input id="q" type="search" placeholder="搜索本题型：题干 / 解析…" autocomplete="off">
      <select id="fState">
        <option value="all">全部题目</option>
        <option value="todo">只看未做</option>
        <option value="wrong">只看待加强</option>
        <option value="done">只看已做</option>
      </select>
    </div>
    <div class="tabs">
      <button class="tab" id="btnReset">清空本题型</button>
    </div>
  </div>
</div>

<div class="main">
  <div id="main"></div>
</div>

<div class="footer">山东专升本高数一</div>
<button class="top" id="top" title="回到顶部">↑</button>

<script>window.GS_TYPE="证明";</script>
<script src="assets/manifest.js"></script>
<script src="assets/nav.js"></script>
<script src="data/questions.js"></script>
<script src="data/kp_type.js"></script>
<script src="assets/store.js"></script>
<script src="../assets/pg_gs_type.js"></script>
<script src="../assets/hub.js"></script>
<script src="../assets/mathrender.js"></script>
<script>(function(){"use strict";var e=document.getElementById("top");if(e)e.onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};})();</script>

<script>
(function(){
  "use strict";
  if(!window.GS_QUESTIONS || !window.GS_KP_TYPE) return;
  var kp = window.GS_KP_TYPE;
  function stat(tp){
    var n = 0, g = {}, order = [];
    (window.GS_QUESTIONS.questions || []).forEach(function(q){
      if(q.type !== tp) return;
      n++;
      var lb = kp[q.id] || "其他";
      if(!g[lb]){ g[lb] = 0; order.push(lb); }
      g[lb]++;
    });
    return {n:n, groups:order, cnt:g, kn:order.length};
  }
  function set(id, v){ var e = document.getElementById(id); if(e) e.textContent = v; }

  var zm = stat("证明"), yy = stat("应用");

  /* 题型专项.html 的两张卡片 */
  set("zmQ", zm.n); set("zmK", zm.kn);
  set("yyQ", yy.n); set("yyK", yy.kn);
  var dz = document.getElementById("zmDist");
  if(dz) dz.textContent = zm.groups.map(function(k){ return k + " " + zm.cnt[k]; }).join(" · ");
  var dy = document.getElementById("yyDist");
  if(dy) dy.textContent = yy.groups.map(function(k){ return k + " " + yy.cnt[k]; }).join(" · ");

  /* 单题型页头部 */
  var CUR = window.GS_TYPE;
  if(CUR){
    var st = (CUR === "证明") ? zm : (CUR === "应用" ? yy : null);
    if(st){
      set("hBadge", st.n + " 题");
      set("hCntQ", st.n);
      set("hCntK", st.kn);
    }
  }
})();
</script>
</body>
</html>
