<script>
(function(){
  "use strict";
  var DATA = {"mode": "rot", "items": [{"title": "第 1 章 · 函数、极限和连续", "desc": "本章 70 题。"}, {"title": "第 2 章 · 一元函数微分学", "desc": "本章 51 题。"}, {"title": "第 3 章 · 一元函数积分学", "desc": "本章 50 题。"}, {"title": "第 4 章 · 向量代数与空间解析几何", "desc": "本章 37 题。"}, {"title": "第 5 章 · 多元函数微积分学", "desc": "本章 39 题。"}, {"title": "第 6 章 · 无穷级数", "desc": "本章 37 题。"}, {"title": "第 7 章 · 常微分方程", "desc": "本章 37 题。"}, {"title": "第 8 章 · 必备公式与难点题型", "desc": "本章 106 题。"}]};
  var START = "2026-10-29";
  var PREFIX = "pr-ch";
  function today(){
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function parse(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  var t = today(), title, desc, href, idx;

  if (DATA.mode === "date") {
    var hit = null;
    for (var i=0;i<DATA.items.length;i++){
      var it = DATA.items[i];
      if (!hit && parse(it.date) <= t && t < parse(it.end)) hit = it;
    }
    if (!hit) hit = DATA.items[0];
    title = "第 " + hit.no + " 组 · " + hit.theme;
    desc  = "覆盖 " + hit.date + " ~ " + hit.end + "。" + (hit.n ? "，共 " + hit.n + " 题。" : "");
    href  = PREFIX + hit.no + ".html";
  } else {
    var days = Math.floor((t - parse(START)) / 86400000);
    if (days < 0) days = 0;
    idx = (days % DATA.items.length);
    var it2 = DATA.items[idx];
    title = it2.title;
    desc  = it2.desc;
    href  = PREFIX + (idx+1) + ".html";
  }
  var a = document.getElementById("dayTitle");
  if (a) a.textContent = title;
  var b = document.getElementById("dayDesc");
  if (b) b.textContent = desc;
  var c = document.getElementById("dayGo");
  if (c) c.href = href;
  var d2 = document.getElementById("dayTag");
  if (d2) d2.textContent = "今天 " + (t.getMonth()+1) + " 月 " + t.getDate() + " 日";
})();
</script>
