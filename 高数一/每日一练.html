<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一练 · 山东专升本高数一</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/design.css">
<style>
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 15px;
  text-decoration:none;display:block;transition:border-color .15s,box-shadow .15s}
.dcard:hover{border-color:var(--blue-400);box-shadow:0 3px 12px rgba(46,116,181,.09)}
.dcard .n{font-size:15.5px;font-weight:700;color:var(--blue-900);line-height:1.3}
.dcard .dt{font-size:12px;color:var(--ink-4);margin-top:4px}
.dcard .mt{font-size:11.5px;color:var(--ink-4);margin-top:8px;
  display:flex;justify-content:space-between;align-items:center}
.dcard .mt b{color:var(--blue-600);font-weight:600}
.dcard.today{border:1.5px solid var(--blue-500);background:var(--blue-50)}
.dcard.today .n{color:var(--blue-700)}
.tbadge{font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--blue-600);
  color:#fff;font-weight:600;margin-left:5px;vertical-align:middle}
.dsec{margin:26px 0 13px;font-size:15px;font-weight:700;color:var(--blue-900);
  display:flex;align-items:baseline;gap:9px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.dsec .n{font-size:12px;font-weight:400;color:var(--ink-4);margin-left:auto}
</style>
</head>
<body>

<div id="nav" class="nav"></div>

<div class="page-head">
  <div class="in">
    <h1>每日一练 <span class="badge" id="hBadge">100 天</span></h1>
    <div class="sub" id="hSub"></div>
  </div>
</div>

<div class="main">
  <div id="grid"></div>
</div>

<div class="footer">山东专升本高数一</div>
<button class="top" id="top" title="回到顶部">↑</button>

<script>window.GS_STATIC_MAP={"__home": "每日一练.html"};</script>
<script src="assets/manifest.js"></script>
<script src="assets/nav.js"></script>
<script src="data/daily100.js"></script>
<script>
(function(){
  "use strict";
  var D = window.GS_DAILY100;
  var host = document.getElementById("grid");
  if (!D || !host) return;

  var hb = document.getElementById("hBadge");
  if (hb) hb.textContent = D.days + " 天";

  var hs = document.getElementById("hSub");
  if (hs) hs.textContent = "共 " + D.days + " 套 · 每天 " + (D.perDay || 23) + " 题";

  function key(d){
    return d + "|" + (new Date().toDateString());
  }
  var TODAY = (function(){
    var t = new Date();
    return t.getFullYear() + "-" + ("0"+(t.getMonth()+1)).slice(-2) + "-" + ("0"+t.getDate()).slice(-2);
  })();

  /* 每 10 天一组 */
  var h = "";
  for (var g = 0; g < D.papers.length; g += 10) {
    var seg = D.papers.slice(g, g + 10);
    h += '<div class="dsec">第 ' + (g + 1) + ' – ' + (g + seg.length) + ' 天'
      + '<span class="n">' + seg.length + ' 套</span></div>';
    h += '<div class="dgrid">';
    seg.forEach(function(p){
      var isToday = (p.date === TODAY);
      h += '<a class="dcard' + (isToday ? " today" : "") + '" href="daily.html?d=' + p.d + '">'
        + '<div class="n">第 ' + p.d + ' 天' + (isToday ? '<span class="tbadge">今天</span>' : '') + '</div>'
        + '<div class="dt">' + p.date + '</div>'
        + '<div class="mt"><span>' + (p.ids ? p.ids.length : (D.perDay || 23)) + ' 题</span><b>进入 →</b></div>'
        + '</a>';
    });
    h += '</div>';
  }
  host.innerHTML = h;
})();
</script>
<script>(function(){"use strict";var e=document.getElementById("top");
if(e)e.onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};})();</script>
</body>
</html>
