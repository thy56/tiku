<script>
(function(){
  "use strict";
  var DATA = {"mode": "date", "items": [{"no": 1, "theme": "综合练习 1", "date": "2026-10-29", "end": "2026-10-30"}, {"no": 2, "theme": "综合练习 2", "date": "2026-10-30", "end": "2026-10-31"}, {"no": 3, "theme": "综合练习 3", "date": "2026-10-31", "end": "2026-11-01"}, {"no": 4, "theme": "综合练习 4", "date": "2026-11-01", "end": "2026-11-02"}, {"no": 5, "theme": "综合练习 5", "date": "2026-11-02", "end": "2026-11-03"}, {"no": 6, "theme": "综合练习 6", "date": "2026-11-03", "end": "2026-11-04"}, {"no": 7, "theme": "综合练习 7", "date": "2026-11-04", "end": "2026-11-05"}, {"no": 8, "theme": "综合练习 8", "date": "2026-11-05", "end": "2026-11-06"}, {"no": 9, "theme": "综合练习 9", "date": "2026-11-06", "end": "2026-11-07"}, {"no": 10, "theme": "综合练习 10", "date": "2026-11-07", "end": "2026-11-08"}, {"no": 11, "theme": "综合练习 11", "date": "2026-11-08", "end": "2026-11-09"}]};
  var START = "2026-10-29";
  var PREFIX = "pr-";
  function today(){
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function parse(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  var t = today(), title, desc, href, idx;

  if (DATA.mode === "date") {
    var hit = null;
    for (var i=0;i<DATA.items.length;i++){
      var it = DATA.items[i];
      if (!hit && parse(it.date) <= t && t < parse(it.end)) hit = it;
    }
    if (!hit) hit = DATA.items[0];
    title = "第 " + hit.no + " 组 · " + hit.theme;
    desc  = "覆盖 " + hit.date + " ~ " + hit.end + "，共 50 题。";
    href  = PREFIX + hit.no + ".html";
  } else {
    var days = Math.floor((t - parse(START)) / 86400000);
    if (days < 0) days = 0;
    idx = (days % DATA.items.length);
    var it2 = DATA.items[idx];
    title = it2.title;
    desc  = it2.desc;
    href  = PREFIX + (idx+1) + ".html";
  }
  var a = document.getElementById("dayTitle");
  if (a) a.textContent = title;
  var b = document.getElementById("dayDesc");
  if (b) b.textContent = desc;
  var c = document.getElementById("dayGo");
  if (c) c.href = href;
  var d2 = document.getElementById("dayTag");
  if (d2) d2.textContent = "今天 " + (t.getMonth()+1) + " 月 " + t.getDate() + " 日";
})();
</script>
